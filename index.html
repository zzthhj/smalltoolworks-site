<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmallToolWorks</title>
  <meta
    name="description"
    content="SmallToolWorks builds simple, practical apps for everyday problems."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #f7f7f8;
      color: #171717;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border: 1px solid #e8e8ea;
      border-radius: 24px;
      padding: 56px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 72px);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    p {
      margin: 24px 0 0;
      font-size: 20px;
      line-height: 1.6;
      color: #555;
      max-width: 560px;
    }

    .status {
      margin-top: 40px;
      display: inline-block;
      padding: 10px 14px;
      border-radius: 999px;
      background: #f0f0f2;
      font-size: 14px;
      color: #444;
    }

    footer {
      margin-top: 56px;
      padding-top: 24px;
      border-top: 1px solid #ededed;
      font-size: 14px;
      color: #888;
    }

    @media (max-width: 600px) {
      .page {
        padding: 18px;
      }

      .card {
        padding: 36px 26px;
        border-radius: 20px;
      }

      p {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">
      <div class="brand">SmallToolWorks</div>

      <h1>Simple tools.<br />Useful results.</h1>

      <p>
        SmallToolWorks builds practical apps that solve specific everyday
        problems simply and efficiently.
      </p>

      <div class="status">Official website coming soon.</div>

      <footer>
        © 2026 SmallToolWorks
      </footer>
    </section>
  </main>
</body>
</html>
